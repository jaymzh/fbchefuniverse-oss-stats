name: Weekly report

on:
  schedule:
    # wed afternoon at noonish, gives enough
    # time to merge it, or fix it
    - cron: '15 12 * * 3'
      timezone: America/Los_Angeles
  workflow_dispatch:

concurrency:
  group: weekly-chef-oss-report
  cancel-in-progress: false

permissions: {}

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      TZ: America/Los_Angeles
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get -y install imagemagick libmagickwand-dev

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Install oss-stats binstubs
        run: bundle binstubs oss-stats

      - name: Generate weekly reports
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Running report..."
          ./scripts/run_report.sh

      - name: Commit and open update weekly PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Configuring git..."
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          echo "Making branch and committing report..."
          report_date="$(date +%F)"
          branch="automation/weekly-report-$report_date"
          git switch -c "$branch"
          git add -- *_reports/*.md
          if git diff --cached --quiet; then
            echo "No weekly report changes to commit."
            exit 0
          fi
          git commit --signoff -m "Update weekly Chef OSS reports for $report_date"
          git push --force-with-lease origin "HEAD:$branch"

          echo "Creating PR..."
          # Make a PR only if this week doesn't have a PR already
          if ! gh pr list --head "$branch" --base main --state open --json number --jq '.[0].number' | grep -q .; then
            gh pr create --base main --head "$branch" --title "Weekly FBChefUniverse OSS reports for $report_date" --body "Automated weekly report generation for $report_date."
            echo "PR created!"
          else
            echo "PR already exists, skipping..."
          fi
